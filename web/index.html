<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gavel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cg fill='white' transform='translate%28-3.80 1.36%29'%3E%3Cg transform='rotate%2845 16 16%29'%3E%3Crect x='9' y='5' width='14' height='6.5' rx='1.6'/%3E%3Crect x='14.75' y='11' width='2.5' height='11' rx='1.25'/%3E%3C/g%3E%3Crect x='17' y='23' width='10' height='3' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><g fill="white" transform="translate(-3.80 1.36)"><g transform="rotate(45 16 16)"><rect x="9" y="5" width="14" height="6.5" rx="1.6"/><rect x="14.75" y="11" width="2.5" height="11" rx="1.25"/></g><rect x="17" y="23" width="10" height="3" rx="1.2"/></g></svg>
      <span class="brand-name">Gavel</span>
      <span class="brand-tag">avaliador automático de funções Go</span>
    </a>
    <div class="topbar-right">
      <nav class="segmented" role="tablist" aria-label="Modo">
        <button type="button" role="tab" data-mode="practice">Prática</button>
        <button type="button" role="tab" data-mode="exam">Prova</button>
        <button type="button" role="tab" data-mode="admin">Docente</button>
      </nav>
      <div class="user" id="user"></div>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
